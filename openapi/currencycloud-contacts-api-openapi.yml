openapi: 3.2.0
info:
  description: The Currencycloud API is a robust, predictable, easy-to-use API for converting money between currencies and making payments around the world. Dynamically register sub-accounts to provide white labeled money transfer services to your own customers.
  version: 2.43.0
  title: Currencycloud Contacts API
  termsOfService: https://www.currencycloud.com/terms-and-conditions/
  contact:
    name: support
    email: support@currencycloud.com
servers:
- url: https://devapi.currencycloud.com/v2
tags:
- name: Contacts
  description: Create, search and manage the list of users that have access in your Currencycloud account or associated sub-accounts.
paths:
  /contacts/current:
    get:
      tags:
      - Contacts
      x-api-group: manage
      summary: Get Authenticating Contact
      description: Gets the contact record for the authenticated user.
      operationId: GetAuthenticatingContact
      parameters:
      - name: X-Auth-Token
        in: header
        required: true
        description: Authentication token
        schema:
          type: string
          minLength: 32
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorized.
          x-errors:
          - code: invalid_supplied_credentials
            category: username
            message: Authentication failed with the supplied credentials
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Resource not found.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
        '429':
          description: Too many requests.
          x-errors:
          - code: too_many_requests
            category: base
            message: Too many requests have been made to the api. Please refer to the Developer Center for more information
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Internal server error
          x-errors:
          - code: internal_server_error
            category: base
            message: Internal server error
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
        '503':
          description: Service is temporary unavailable
          x-errors:
          - code: service_unavailable
            category: base
            message: Service is temporarily unavailable
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
        default:
          description: Unexpected error.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
  /contacts/find:
    post:
      tags:
      - Contacts
      x-api-group: manage
      summary: Find Contacts
      description: Returns contacts that match the parameters.
      operationId: FindContactsPost
      parameters:
      - name: X-Auth-Token
        in: header
        required: true
        description: Authentication token
        schema:
          type: string
          minLength: 32
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Client error.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindContactsError'
        '401':
          description: Unauthorized.
          x-errors:
          - code: invalid_supplied_credentials
            category: username
            message: Authentication failed with the supplied credentials
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Resource not found.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
        '429':
          description: Too many requests.
          x-errors:
          - code: too_many_requests
            category: base
            message: Too many requests have been made to the api. Please refer to the Developer Center for more information
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Internal server error
          x-errors:
          - code: internal_server_error
            category: base
            message: Internal server error
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
        '503':
          description: Service is temporary unavailable
          x-errors:
          - code: service_unavailable
            category: base
            message: Service is temporarily unavailable
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
        default:
          description: Unexpected error.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                account_name:
                  type: string
                  maxLength: 150
                  minLength: 1
                  pattern: \S+
                  description: Account name
                account_id:
                  type: string
                  format: uuid
                  description: Sub-Account UUID
                first_name:
                  type: string
                  maxLength: 100
                  minLength: 1
                  description: The contact's first name.
                last_name:
                  type: string
                  maxLength: 100
                  minLength: 1
                  description: The contact's last name.
                email_address:
                  type: string
                  maxLength: 255
                  minLength: 6
                  pattern: ^[\w\.\_\%\-\+]+@([\w-]+\.)+\w{2,}+$
                  description: The contact's email address.
                your_reference:
                  type: string
                  maxLength: 255
                  minLength: 1
                  description: User-generated reference code.
                phone_number:
                  type: string
                  maxLength: 100
                  minLength: 1
                  description: The contact's phone number.
                login_id:
                  type: string
                  maxLength: 50
                  minLength: 1
                  description: The contact's Currencycloud login ID.
                status:
                  type: string
                  enum:
                  - enabled
                  - not_enabled
                  description: Contact status - "enabled" allows the contact to conduct activity on the sub-account, "not_enabled" disables the contact.
                locale:
                  type: string
                  maxLength: 5
                  minLength: 2
                  description: Locale code ("en", "en-US", "fr-FR").
                timezone:
                  type: string
                  maxLength: 35
                  minLength: 7
                  description: Timezone ("Europe/London", "America/New_York").
                page:
                  type: string
                  pattern: ^\d+$
                  description: Page number
                per_page:
                  type: string
                  pattern: ^\d+$
                  description: Number of results per page.
                order:
                  type: string
                  maxLength: 255
                  minLength: 1
                  description: Any field name to change the sort order.
                order_asc_desc:
                  type: string
                  enum:
                  - asc
                  - desc
                  default: asc
                  description: Sort records in ascending or descending order.
  /contacts/{id}:
    get:
      tags:
      - Contacts
      x-api-group: manage
      summary: Get Contact
      description: Gets the contact for the given ID.
      operationId: GetContact
      parameters:
      - name: X-Auth-Token
        in: header
        required: true
        description: Authentication token
        schema:
          type: string
          minLength: 32
      - name: id
        in: path
        required: true
        description: Contact UUID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Client error.
          x-errors:
          - code: id_is_not_valid_uuid
            category: id
            message: id should be in UUID format
            params: ''
          - code: contact_not_found
            category: id
            message: Contact was not found for this id
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContactError'
        '401':
          description: Unauthorized.
          x-errors:
          - code: invalid_supplied_credentials
            category: username
