              description: A unique reference for the request.
  /contacts/create:
    post:
      tags:
      - Contacts
      x-api-group: manage
      summary: Create Contact
      description: Creates a new contact and attaches it to a sub-account. Returns the new contact entity on success.
      operationId: CreateContact
      consumes:
      - multipart/form-data
      produces:
      - application/json
      parameters:
      - name: X-Auth-Token
        in: header
        required: true
        type: string
        description: Authentication token
        minLength: 32
      - name: account_id
        in: formData
        required: true
        type: string
        description: Account UUID
        format: uuid
      - name: first_name
        in: formData
        required: true
        type: string
        description: The contact's first name.
        minLength: 1
        maxLength: 100
      - name: last_name
        in: formData
        required: true
        type: string
        description: The contact's last name.
        minLength: 1
        maxLength: 100
      - name: email_address
        in: formData
        required: true
        type: string
        description: The contact's email address.
        pattern: ^[\w\.\_\%\-\+]+@([\w-]+\.)+\w{2,}+$
        minLength: 6
        maxLength: 255
      - name: phone_number
        in: formData
        required: true
        type: string
        description: The contact's phone number.
        minLength: 1
        maxLength: 100
      - name: your_reference
        in: formData
        required: false
