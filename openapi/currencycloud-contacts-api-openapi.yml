              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Resource not found.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: Too many requests.
          x-errors:
          - code: too_many_requests
            category: base
            message: Too many requests have been made to the api. Please refer to the Developer Center for more information
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Internal server error
          x-errors:
          - code: internal_server_error
            category: base
            message: Internal server error
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
        '503':
          description: Service is temporary unavailable
          x-errors:
          - code: service_unavailable
            category: base
            message: Service is temporarily unavailable
            params: ''
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
        default:
          description: Unexpected error.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
    post:
      tags:
      - Contacts
      x-api-group: manage
      summary: Update Contact
      description: Updates an existing contact. Returns the updated contact entity on success.
      operationId: UpdateContact
      parameters:
      - name: X-Auth-Token
        in: header
        required: true
        description: Authentication token
        schema:
          type: string
          minLength: 32
      - name: id
        in: path
        required: true
        description: Contact UUID
        schema:
          type: string
          format: uuid
      - name: first_name
        in: query
        required: false
        description: The contact's first name.
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - name: last_name
        in: query
        required: false
        description: The contact's last name.
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - name: email_address
        in: query
        required: false
        description: The contact's email address. A request to update a contact's email address does not immediately update the value. Instead, an email change request flow is initiated, sending notifications to both the old and new email addresses. The value will be updated when the change is confirmed via a link sent to the new email address.
        schema:
          type: string
          maxLength: 255
          minLength: 6
          pattern: ^[\w\.\_\%\-\+]+@([\w-]+\.)+\w{2,}+$
      - name: your_reference
        in: query
        required: false
        description: User-generated reference code.
        schema:
          type: string
          maxLength: 255
          minLength: 1
      - name: phone_number
        in: query
        required: false
        description: The contact's phone number.
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - name: mobile_phone_number
        in: query
        required: false
        description: The contact's mobile phone number.
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - name: login_id
        in: query
        required: false
        description: The contact's Currencycloud login ID.
        schema:
          type: string
          maxLength: 50
          minLength: 1
      - name: status
        in: query
        required: false
        description: Contact status - "enabled" allows the contact to conduct activity on the sub-account, "not_enabled" disables the contact.
        schema:
          type: string
          enum:
          - enabled
          - not_enabled
      - name: locale
        in: query
        required: false
        description: Locale code ("en", "en-US", "fr-FR").
        schema:
          type: string
          maxLength: 5
          minLength: 2
      - name: timezone
        in: query
        required: false
        description: Timezone ("Europe/London", "America/New_York").
        schema:
          type: string
          maxLength: 35
          minLength: 7
      - name: date_of_birth
        in: query
        required: false
        description: Contact's date of birth. ISO 8601 format YYYY-MM-DD. Required if account type is individual.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              description: A unique reference for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Client error.
          x-errors:
          - code: at_least_one_parameter
            category: base
            message: 'At least one parameter should be present: first_name, last_name, email_address, phone_number, mobile_phone_number, login_id, locale, timezone, status'
            params: ''
          - code: id_is_not_valid_uuid
            category: id
            message: id should be in UUID format
            params: ''
          - code: first_name_is_too_short
            category: first_name
            message: first_name cann ot be shorter than 1 character(s)
            params: '{ "minlength" => 1 }'
          - code: first_name_is_too_long
            category: first_name
            message: first_name can not be longer than 100 character(s)
            params: '{ "maxlength" => 100 }'
          - code: last_name_is_too_short
            category: last_name
            message: last_name can not be shorter than 1 character(s)
            params: '{ "minlength" => 1 }'
          - code: last_name_is_too_long
