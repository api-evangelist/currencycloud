openapi: 3.0.3
info:
  title: api-onboarding Account Usage Form API
  version: v1
servers:
- url: /onboarding
  description: Relative URL
- url: https://api.currencycloud.com/onboarding
  description: Production server (uses live data)
- url: https://devapi.currencycloud.com/onboarding
  description: Dev server (uses test data)
tags:
- name: Form
paths:
  /v1/forms/{form_id}/submit:
    post:
      summary: Submit Form
      description: Submits the application form.
      tags:
      - Form
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: form_id
        description: Form UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/form'
        '422':
          description: Form already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_error_response'
  /v1/forms:
    get:
      summary: Get Forms
      description: Retrieves all application forms for the house account.
      tags:
      - Form
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: order
        in: query
        schema:
          type: string
      - name: order_asc_desc
        in: query
        schema:
          type: string
      - name: application_status
        in: query
        description: Filter by application_status.
        schema:
          type: string
          enum:
          - new
          - submitted
      - name: entity_type
        description: Type of applicant - individual or corporate.
        in: query
        schema:
          type: string
          enum:
          - individual
          - corporate
      - name: page
        description: Page number
        in: query
        schema:
          type: integer
      - name: per_page
        description: Number of results per page.
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Retrieves all forms for a house_account_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  forms:
                    type: array
                    items:
                      $ref: '#/components/schemas/form_with_associations'
                  pagination:
                    type: object
                    properties:
                      total_entries:
                        type: integer
                        minimum: 0
                      total_pages:
                        type: integer
                        minimum: 0
                      current_page:
                        type: integer
                        minimum: 1
                      per_page:
                        type: integer
                        minimum: 1
                      previous_page:
                        type: integer
                        minimum: 1
                        nullable: true
                      next_page:
                        type: integer
                        minimum: 1
                        nullable: true
                      order:
                        type: string
                      order_asc_desc:
                        type: string
                    required:
                    - total_entries
                    - total_pages
                    - current_page
                    - per_page
                    - previous_page
                    - next_page
                    - order
                    - order_asc_desc
        '400':
          description: Returns error if request validation errors occur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_error_response'
    post:
      summary: Create Form
      description: Creates a new application form. Returns the new form entity on success.
      tags:
      - Form
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters: []
      responses:
        '400':
          description: Invalid parameter in request params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_error_response'
        '201':
          description: Creates a form when correct params are provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/form'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_form_request'
  /v1/forms/{form_id}:
    get:
      summary: Get Form
      description: Retrieves the application form with the given ID.
      tags:
      - Form
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: form_id
        description: Form UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Retrieves form if the UUID exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/form_with_associations'
        '404':
          description: Record not found - Invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/not_found_response'
    put:
      summary: Update Form
      description: Updates an application form.
      tags:
      - Form
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: form_id
        description: Form UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Invalid parameter in request params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_error_response'
        '200':
          description: Updates form when correct params are provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/form'
        '422':
          description: Form is already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_error_response'
        '404':
          description: Form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/not_found_response'
