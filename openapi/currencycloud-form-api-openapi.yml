        email:
          description: The applicant's email address.
          type: string
        entity_type:
          description: Type of applicant - individual or corporate.
          type: string
          enum:
          - individual
          - corporate
        brand_name:
          type: string
        brand_key:
          type: string
        referred_by:
          description: How did the applicant hear about us.
          type: string
          nullable: true
        phone_number:
          description: The applicant's phone number.
          type: string
          nullable: true
        contact_name:
          description: The applicant's name.
          type: string
          nullable: true
      required:
      - agreed_to_marketing_emails
      - agreed_to_terms_and_conditions
      - country
      - email
      - entity_type
      - brand_name
    business_information:
      type: object
      properties:
        id:
          type: string
          description: Unique ID for the Business Information entity.
        form_id:
          type: string
          description: Form UUID
        document_ids:
          type: array
          description: List of IDs for any uploaded supporting documents.
          items:
            type: string
        business_country:
          description: The country the business is registered in.
          type: string
        company_name:
          description: The company name.
          type: string
        trading_name:
          description: The company's trading name.
          type: string
          nullable: true
        legal_entity_type:
          description: Company's legal entity type e.g. "limited_liability_company"
          type: string
        sector:
          description: The primary sector the company operates in.
          type: string
        company_registration_number:
          description: An official number that identifies the company.
          type: string
          nullable: true
        vat_number:
          description: The company's VAT number or Tax ID  number.
          type: string
          nullable: true
        incorporation_date:
          description: The date the company was incorporated.
          type: string
          format: date
        business_website:
          description: The company's website URL or other online presence.
          type: string
          nullable: true
        business_activity_description:
          description: Description of the company's activities.
          type: string
        registered_address:
          description: The company's registered address.
          type: object
          properties:
            city:
              type: string
            street:
              type: string
            country:
              type: string
            postal_code:
              type: string
            apartment_number:
              type: string
              nullable: true
            building_name:
              type: string
              nullable: true
            building_number:
              type: string
              nullable: true
            state_or_province:
              type: string
              nullable: true
          required:
          - city
          - street
          - country
          - postal_code
        trading_address:
          type: object
          properties:
            city:
              type: string
            street:
              type: string
            country:
              type: string
            postal_code:
              type: string
            apartment_number:
              type: string
              nullable: true
            building_name:
              type: string
              nullable: true
            building_number:
              type: string
              nullable: true
            state_or_province:
              type: string
              nullable: true
          required:
          - city
          - street
          - country
          - postal_code
        created_at:
          type: string
          format: date-time
          description: Date the Business Information record was created.
        updated_at:
          type: string
          format: date-time
          description: Date the Business Information record was last updated.
      required:
      - business_country
      - company_name
      - legal_entity_type
      - sector
      - incorporation_date
      - business_activity_description
      - registered_address
      nullable: true
    account_usage:
      type: object
      properties:
        id:
          type: string
          description: UUID for the Account Usage entity.
        form_id:
          type: string
          description: Form UUID
        document_ids:
          type: array
          description: List of IDs for any uploaded supporting documents.
          items:
            type: string
        collections_account:
          description: Does the account receive funds from third parties.
          type: boolean
        collection_currencies:
          description: List of currencies to fund the account with.
          type: array
          items:
            type: string
            nullable: true
        payment_currencies:
          type: array
          description: List of payout currencies.
          items:
            type: string
            nullable: true
        transaction_countries:
          type: array
          description: List of countries that corporate accounts want to send/receive money to/from.
          items:
            type: string
            nullable: true
        one_off_transaction:
          type: boolean
          description: Will it be a single one-off transaction.
        estimated_monthly_transaction_currency:
          description: Currency of the estimated monthly transaction value.
          type: string
          nullable: true
        estimated_monthly_transaction_value:
          description: Estimated monthly value of what a corporate account is going to transact on the platform.
          type: integer
          nullable: true
        estimated_monthly_transaction_volume:
          description: How often do corporates expect to send or receive funds.
          type: integer
          nullable: true
        source_of_funds:
          description: The source of money that will be sent through the platform.
          type: string
          nullable: true
        primary_purpose:
          description: The reason for opening an account with Currencycloud.
          type: string
          nullable: true
        purpose_details:
          description: Additional details if primary_purpose is 'other'.
          type: string
          nullable: true
        created_at:
          description: Date the Account Usage record created.
          type: string
          format: date-time
        updated_at:
          description: Date the Account Usage record was last updated.
          type: string
          format: date-time
      required:
      - collections_account
      - one_off_transaction
      nullable: true
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
