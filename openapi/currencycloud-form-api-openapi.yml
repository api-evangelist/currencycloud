components:
  schemas:
    form_with_associations:
      type: object
      properties:
        id:
          type: string
          description: The form's UUID.
        detached_document_ids:
          type: array
          description: List of IDs for any uploaded supporting documents.
          items:
            type: string
        affiliate_code:
          type: string
          description: Client's own use, e.g. to track lead source.
          nullable: true
        agreed_to_marketing_emails:
          type: boolean
          description: Agreed to marketing emails.
        agreed_to_terms_and_conditions:
          type: boolean
          description: Agreed to terms and conditions.
        agreed_to_corporate_authority:
          type: boolean
          description: Confirmed authority to act on behalf of company.
        country:
          description: Home country for individual applicants or country of registered address for corporate applicants. Two or three character ISO country code.
          type: string
        email:
          description: The applicant's email address.
          type: string
        entity_type:
          type: string
          description: Type of applicant - individual or corporate.
        brand_name:
          type: string
        brand_key:
          type: string
        referred_by:
          description: How did the applicant hear about us.
          type: string
          nullable: true
        products_required:
          type: array
          items:
            type: string
        state:
          type: string
        phone_number:
          description: The applicant's phone number.
          type: string
        contact_name:
          description: The applicant's name.
          type: string
        created_at:
          type: string
          format: date-time
          description: Date and time the form was created.
        updated_at:
          type: string
          format: date-time
          description: Date and time the form was last updated.
        business_information:
          description: Further information about corporate applicants.
          $ref: '#/components/schemas/business_information'
        account_usage:
          description: Information about the intended use of the account.
          $ref: '#/components/schemas/account_usage'
        people:
          description: Information about people associated with the application.
          type: array
          items:
            $ref: '#/components/schemas/person'
      required:
      - id
      - agreed_to_marketing_emails
      - agreed_to_terms_and_conditions
      - country
      - entity_type
      - brand_name
      - products_required
      - created_at
      - updated_at
    form:
      type: object
      properties:
        id:
          type: string
          description: The form's UUID.
        detached_document_ids:
          description: List of IDs for any uploaded supporting documents.
          type: array
          items:
            type: string
        affiliate_code:
          description: Client's own use, e.g. to track lead source.
          type: string
          nullable: true
        agreed_to_marketing_emails:
          description: Agreed to marketing emails.
          type: boolean
        agreed_to_terms_and_conditions:
          description: Agreed to terms and conditions.
          type: boolean
        agreed_to_corporate_authority:
          description: Confirmed authority to act on behalf of company.
          type: boolean
        country:
          description: Home country for individual applicant or country of registered address for corporate applicant.
          type: string
        email:
          description: The applicant's email address.
          type: string
        entity_type:
          description: Type of applicant - individual or corporate.
          type: string
        brand_name:
          type: string
        brand_key:
          type: string
        referred_by:
          description: How did the applicant hear about us.
          type: string
          nullable: true
        products_required:
          type: array
          items:
            type: string
        state:
          type: string
        phone_number:
          description: The applicant's phone number.
          type: string
        contact_name:
          type: string
          description: The applicant's name.
        created_at:
          type: string
          format: date-time
          description: Date and time the form was created.
        updated_at:
          type: string
          format: date-time
          description: Date and time the form was last updated.
      required:
      - id
      - agreed_to_marketing_emails
      - agreed_to_terms_and_conditions
      - brand_name
      - country
      - entity_type
      - products_required
      - created_at
      - updated_at
    validation_error_response:
      type: object
      properties:
        status:
          type: string
        error_code:
          type: string
        reason:
          type: string
        error_messages:
          type: object
      required:
      - status
      - error_code
      - reason
      - error_messages
    person:
      type: object
      properties:
        id:
          type: string
        form_id:
          type: string
        document_ids:
          type: array
          description: List of IDs for any uploaded supporting documents.
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        phone_number:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        ownership_percentage:
          type: number
          minimum: 0
          maximum: 100
        id_number:
          type: string
          nullable: true
        home_country:
          type: string
        passport_number:
          type: string
          nullable: true
        passport_country_of_issue:
          type: string
          nullable: true
        personal_address:
          type: object
          properties:
            city:
              type: string
            street:
              type: string
            country:
              type: string
            postal_code:
              type: string
            apartment_number:
              type: string
              nullable: true
            building_name:
              type: string
              nullable: true
            building_number:
              type: string
              nullable: true
            state_or_province:
              type: string
              nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - roles
      - first_name
      - last_name
      - home_country
    not_found_response:
      type: object
      properties:
        status:
          type: string
        error_code:
          type: string
        reason:
          type: string
        error_messages:
          type: object
          nullable: true
      required:
      - status
      - error_code
      - reason
      - error_messages
