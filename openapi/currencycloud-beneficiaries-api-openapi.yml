  /beneficiaries/create:
    post:
      tags:
      - Beneficiaries
      x-api-group: pay
      summary: Create Beneficiary
      description: Creates a new beneficiary. Returns the new beneficiary entity on success.
      operationId: CreateBeneficiary
      consumes:
      - multipart/form-data
      produces:
      - application/json
      parameters:
      - name: X-Auth-Token
        in: header
        required: true
        type: string
        description: Authentication token
        minLength: 32
      - name: name
        in: formData
        required: true
        type: string
        description: A nickname for the beneficiary.
        pattern: \S+
        minLength: 1
        maxLength: 100
      - name: bank_account_holder_name
        in: formData
        required: true
        type: string
        description: Bank account holder's name.
        minLength: 1
        maxLength: 255
      - name: bank_country
        in: formData
        required: true
        type: string
        description: Two-letter code for the country in which the beneficiary's bank account is held.
        format: iso3166-1-alpha-2
        pattern: ^[A-Z]{2}$
      - name: currency
        in: formData
        required: true
        type: string
        description: Currency in which money is held in the beneficiary's bank account. Three-letter IDO currency code.
        format: iso-4217
        pattern: ^[A-Z]{3}$
      - name: email
        in: formData
        required: false
        type: string
        description: Email address
        pattern: ^[\w\.\_\%\-\+]+@([\w-]+\.)+\w{2,}+$
        minLength: 6
        maxLength: 255
      - name: beneficiary_address
        in: formData
        required: false
        type: string
        description: First line of address.
        minLength: 1
        maxLength: 255
      - name: beneficiary_country
        in: formData
        required: false
        type: string
        description: Two-letter ISO country code. If the beneficiary is a company, this is the country in which the company is registered. If the beneficiary is an individual, this is the country in which the beneficiary is based.
        format: iso3166-1-alpha-2
        pattern: ^[A-Z]{2}$
      - name: account_number
        in: formData
        required: false
        type: string
        description: Bank account number.
        minLength: 1
        maxLength: 50
      - name: routing_code_type_1
        in: formData
        required: false
        type: string
        enum:
        - aba
        - bank_code
        - branch_code
        - bsb_code
        - clabe
        - cnaps
        - ifsc
        - institution_no
        - sort_code
        description: Local payment routing system. If supplied, routing_code_value_1 should also be supplied.
      - name: routing_code_value_1
        in: formData
        required: false
        type: string
        description: Routing code for routing_code_type_1. If supplied, routing_code_type_1 should also be supplied.
        minLength: 1
        maxLength: 50
      - name: routing_code_type_2
        in: formData
        required: false
        type: string
        enum:
        - aba
        - bank_code
        - branch_code
        - bsb_code
        - clabe
        - cnaps
        - ifsc
        - institution_no
        - sort_code
        description: Local payment routing system. If supplied, routing_code_value_2 should also be supplied.
      - name: routing_code_value_2
        in: formData
        required: false
        type: string
        description: Routing code for routing_code_type_2. If supplied, routing_code_type_2 should also be supplied.
        minLength: 1
        maxLength: 50
      - name: bic_swift
        in: formData
        required: false
        type: string
        description: BIC/Swift code
        pattern: ^(\w{8}|\w{11})$
      - name: iban
        in: formData
        required: false
        type: string
        description: IBAN code
        pattern: ([A-Z0-9]\s*){15,34}
      - name: default_beneficiary
        in: formData
        required: false
        type: boolean
        default: false
        description: Payments are made automatically to default beneficiaries when a beneficiary is not specified.
      - name: bank_address
        in: formData
        required: false
        type: string
        description: First line of address.
        minLength: 1
        maxLength: 100
      - name: bank_name
        in: formData
        required: false
        type: string
        description: Bank name
        minLength: 1
      - name: bank_account_type
        in: formData
        required: false
        type: string
        enum:
        - checking
        - savings
        description: Bank account type.
      - name: beneficiary_entity_type
        in: formData
        required: false
        type: string
        enum:
        - company
        - individual
        description: Legal entity
      - name: beneficiary_company_name
        in: formData
        required: false
        type: string
        description: Required if "beneficiary_entity_type" is "company". Company names cannot consist entirely of numbers.
        minLength: 1
        maxLength: 255
      - name: beneficiary_first_name
        in: formData
        required: false
