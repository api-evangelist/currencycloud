  PayerRequirements:
    type: object
    description: Payer requirements.
    properties:
      payer_entity_type:
        description: Legal entity type - company or individual.
        enum:
        - company
        - individual
        type: string
      payment_type:
        description: Type of payment - regular (local) or priority (Swift).
        enum:
        - priority
        - regular
        type: string
      required_fields:
        description: The required payer fields for the payment.
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            validation_rule:
              type: string
    example:
      payer_entity_type: company
      payment_type: priority
      required_fields:
      - name: payer_country
        validation_rule: ^[A-z]{2}$
      - name: payer_city
        validation_rule: ^.{1,255}
      - name: payer_address
        validation_rule: ^.{1,255}
      - name: payer_postcode
        validation_rule: ^.{1,255}
      - name: payer_company_name
        validation_rule: ^.{1,255}
