definitions:
  PaymentFeeUnassignment:
    type: object
    description: Payment fee unassignment.
    required:
    - account_id
    additionalProperties: false
    properties:
      account_id:
        type: string
        format: uuid
        description: ID of the sub-account the rule is assigned to.
    example:
      account_id: 0178a7ba-9a77-4c74-af71-a5f650f00e09
  QuotePaymentFee:
    type: object
    description: Quote payment fee.
    required:
    - account_id
    - payment_currency
    - payment_destination_country
    - payment_type
    - charge_type
    - fee_amount
    - fee_currency
    additionalProperties: false
    properties:
      account_id:
        type: string
        description: Tha account Id.
      payment_currency:
        type: string
        description: Three letter ISO code for the currency of the payment.
      payment_destination_country:
        type: string
        description: Two-letter ISO country code for the payment's destination country.
      payment_type:
        type: string
        description: The payment type the fee is applicable to, priority(Swift) or regular(local).
      charge_type:
        type: string
        description: The charge type the fee is applicable.
      fee_amount:
        type: string
        description: The fee amount.
      fee_currency:
        type: string
        description: Three-letter ISO currency code for the fee's currency.
    example:
      account_id: 0534aaf2-2egg-0134-2f36-10b11cd33cfb
      payment_currency: USD
      payment_destination_country: US
      payment_type: regular
      charge_type: null
      fee_amount: '10.00'
      fee_currency: EUR
  UnauthorizedError:
    type: object
    description: Authorization error.
    required:
    - error_code
    - error_messages
    properties:
      error_code:
        type: string
        description: A high-level error code for the whole request.
        enum:
        - auth_failed
      error_messages:
        type: object
        description: Detailed error information for individual input parameters that failed validation. Object keys are the names of the invalid input parameters. Each parameter may have one or more reasons why it failed.
        additionalProperties:
          type: array
          items:
            type: object
            description: An object that represents one of the reasons why the input parameter failed.
            required:
            - code
            - message
            properties:
              code:
                type: string
                description: A unique code that identifies this error. It can be used for translations.
              message:
                type: string
                description: An explanation of the error in English.
              params:
                type: object
                default: {}
                description: Relevant validation rules that failed. This can be used for translations.
                example:
                  minlength: 1
                  maxlength: 255
    example:
      error_code: auth_failed
      error_messages:
        api_key:
        - code: invalid_supplied_credentials
          message: Authentication failed with the supplied credentials
          params: {}
