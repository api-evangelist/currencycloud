openapi: 3.0.3
info:
  title: api-onboarding Account Usage Business Information API
  version: v1
servers:
- url: /onboarding
  description: Relative URL
- url: https://api.currencycloud.com/onboarding
  description: Production server (uses live data)
- url: https://devapi.currencycloud.com/onboarding
  description: Dev server (uses test data)
tags:
- name: Business Information
paths:
  /v1/forms/{form_id}/business_information:
    get:
      summary: Get Business Information
      description: Gets the business information for the specified application form. Business information is only relevant to corporate applications.
      tags:
      - Business Information
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: form_id
        description: Form UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Business information found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/business_information'
        '404':
          description: Returns error if form is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/not_found_response'
    put:
      summary: Update Business Information
      description: Updates the business information for the specified application form. Business information is only relevant to corporate applications.
      tags:
      - Business Information
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: form_id
        description: Form UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updates business information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/business_information'
        '400':
          description: Returns error if any request body schema validation fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_error_response'
        '422':
          description: Returns error if form has already been submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_error_response'
        '404':
          description: Returns error if form is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/not_found_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_business_information_request'
    delete:
      summary: Delete Business Information
      description: Deletes the business information for the specified form.
      tags:
      - Business Information
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: form_id
        description: Form UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deletes business information if it exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      form_id:
                        type: string
                        description: Form UUID
                    required:
                    - message
                    - form_id
        '422':
          description: Form is already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_error_response'
        '404':
          description: Form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/not_found_response'
components:
  schemas:
    business_information:
      type: object
      properties:
        id:
          type: string
          description: Unique ID for the Business Information entity.
        form_id:
          type: string
          description: Form UUID
        document_ids:
          type: array
          description: List of IDs for any uploaded supporting documents.
          items:
            type: string
        business_country:
          description: The country the business is registered in.
          type: string
        company_name:
          description: The company name.
          type: string
        trading_name:
          description: The company's trading name.
          type: string
          nullable: true
        legal_entity_type:
          description: Company's legal entity type e.g. "limited_liability_company"
          type: string
        sector:
          description: The primary sector the company operates in.
          type: string
        company_registration_number:
          description: An official number that identifies the company.
          type: string
          nullable: true
        vat_number:
          description: The company's VAT number or Tax ID  number.
          type: string
          nullable: true
        incorporation_date:
          description: The date the company was incorporated.
          type: string
          format: date
        business_website:
          description: The company's website URL or other online presence.
          type: string
          nullable: true
        business_activity_description:
          description: Description of the company's activities.
          type: string
        registered_address:
          description: The company's registered address.
          type: object
          properties:
            city:
              type: string
            street:
              type: string
            country:
              type: string
            postal_code:
              type: string
            apartment_number:
              type: string
              nullable: true
            building_name:
              type: string
              nullable: true
            building_number:
              type: string
              nullable: true
            state_or_province:
              type: string
              nullable: true
          required:
          - city
          - street
          - country
          - postal_code
        trading_address:
          type: object
          properties:
            city:
              type: string
            street:
              type: string
            country:
              type: string
            postal_code:
              type: string
            apartment_number:
              type: string
              nullable: true
            building_name:
              type: string
              nullable: true
            building_number:
              type: string
              nullable: true
            state_or_province:
              type: string
              nullable: true
          required:
          - city
          - street
          - country
          - postal_code
        created_at:
          type: string
          format: date-time
          description: Date the Business Information record was created.
        updated_at:
          type: string
          format: date-time
          description: Date the Business Information record was last updated.
      required:
      - business_country
      - company_name
      - legal_entity_type
      - sector
      - incorporation_date
      - business_activity_description
      - registered_address
      nullable: true
    not_found_response:
      type: object
      properties:
        status:
          type: string
        error_code:
          type: string
        reason:
          type: string
        error_messages:
          type: object
          nullable: true
      required:
      - status
      - error_code
      - reason
      - error_messages
    validation_error_response:
      type: object
      properties:
        status:
          type: string
        error_code:
          type: string
        reason:
          type: string
        error_messages:
          type: object
      required:
