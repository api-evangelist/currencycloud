  AccountComplianceSettings:
    type: object
    description: Account compliance settings.
    properties:
      account_id:
        type: string
        description: Account UUID.
      industry_type:
        type: string
        description: String describing the accounts main industry. See merchant category codes for examples
      country_of_incorporation:
        type: string
        description: 'Two-letter ISO-3166 Country Code indicating the country the account is incorporated in. Should only be present for ''legal_entity_type: company'' accounts'
      date_of_incorporation:
        type: string
        format: date
        description: 'The date of the accounts incorporation. Should only be present for ''legal_entity_type: company'' accounts'
      business_website_url:
        type: string
        description: A fully qualified URL (including scheme) indicating a marketplace homepage, a link to a government page concerning the company or the literal string 'no_website_available'.
      expected_transaction_countries:
        type: array
        description: Array of ISO-3166 country codes that these accounts will transact to/from.
        items:
          type: string
      expected_transaction_currencies:
        type: array
        description: Array of ISO-4217 currency codes that these accounts will transact with. Limited to a single item.
        items:
          type: string
      expected_monthly_activity_volume:
        type: integer
        description: The number of transactions this account is expected to conduct.
      expected_monthly_activity_value:
        type: number
        description: The value of transactions this account is expected to conduct. The currency for this is the single item in 'expected_transaction_currencies'.
      tax_identification:
        type: string
        description: 'A tax identification value for companies in the United States or Australia; determined by ''accounts.country''. Should only be present for ''legal_entity_type: company'' accounts.'
      national_identification:
        type: string
        description: 'A National identification value for an individual in the United States; determined by ''accounts.country''. Should only be present for ''legal_entity_type: individual'' accounts.'
      country_of_citizenship:
        type: string
        description: 'An ISO-3166 country code for an individuals citizenship. Should only be present for ''legal_entity_type: individual'' accounts.'
      trading_address_street:
        type: string
        description: 'The street address of the companies trading location. Should only be present for ''legal_entity_type: company'' accounts.'
      trading_address_city:
        type: string
        description: 'The city of the companies trading location. Should only be present for ''legal_entity_type: company'' accounts.'
      trading_address_state:
        type: string
        description: 'The state of the companies trading location. Should only be present for ''legal_entity_type: company'' accounts.'
      trading_address_postalcode:
        type: string
        description: 'The postal code of the companies trading location. Should only be present for ''legal_entity_type: company'' accounts.'
      trading_address_country:
        type: string
        description: 'The ISO-3166 country code of the companies trading location. Should only be present for ''legal_entity_type: company'' accounts.'
      customer_risk:
        description: The risk classification for this account's behaviour.
        type: string
        enum:
        - LOW
        - MEDIUM
        - HIGH
    example:
      account_id: B7DE235A-FF5D-4252-83C2-06A605267FEA
      industry_type: Telecom Services
      country_of_incorporation: US
      date_of_incorporation: 2020-01-30
      business_website_url: https://currencycloud.com
      expected_transaction_countries:
      - US
      - GB
      expected_transaction_currencies:
      - USD
      expected_monthly_activity_volume: 10
      expected_monthly_activity_value: 30.0
      tax_identification: some-tax-id
      national_identification: some-national-id
      country_of_citizenship: US
      trading_address_street: some-street
      trading_address_city: some-city
      trading_address_state: NY
      trading_address_postalcode: 90210
      trading_address_country: US
      customer_risk: LOW
  Pagination:
    type: object
    description: Pagination.
    properties:
      total_entries:
        type: integer
      total_pages:
        type: integer
      current_page:
        type: integer
      per_page:
        type: integer
        description: Number of results per page.
      previous_page:
        type: integer
      next_page:
        type: integer
      order:
        type: string
        description: The field name by which the results are sorted.
      order_asc_desc:
        type: string
        enum:
        - asc
        - desc
        default: asc
        description: Whether results are sorted in ascending or descending order.
    example:
      total_entries: 1
      total_pages: 1
      current_page: 1
      per_page: 25
      previous_page: -1
      next_page: 2
      order: created_at
      order_asc_desc: asc
