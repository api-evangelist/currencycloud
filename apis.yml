aid: currencycloud
name: Currencycloud
description: >-
  Currencycloud is a cross-border payments and foreign-exchange platform, part
  of Visa, that provides a robust, predictable REST API for converting money
  between currencies, holding multi-currency balances, and making payments
  around the world. Its API v2 spans 18 domains — authentication, accounts and
  sub-accounts, balances, beneficiaries, contacts, conversions, funding,
  payers, payments, quotes, rates, reference data, reporting, transactions,
  transfers and withdrawal accounts — and lets businesses dynamically register
  sub-accounts to offer white-labelled money-transfer services to their own
  customers. Currencycloud is an FCA-authorised Electronic Money Institution
  (registration #900199) and a FinCEN-registered money transmitter, and
  publishes official SDKs for JavaScript, Python, Ruby, PHP, Java and .NET.
